<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DOM — Парк Монрепо</title>
    <meta name="description" content="Задание DOM, вариант 1: таблица латинских фраз.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dom.css">
</head>
<body>

<div data-include="header"></div>

<main>
    <section class="page-title">
        <div class="container">
            <h1>DOM</h1>
            <p>Вариант 1. Таблица с фразами на латинском и русском.</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="content">
                <div class="dom-actions">
                    <button class="dom-create" type="button">Создать</button>
                    <button class="dom-recolor" type="button">Перекрасить</button>
                </div>
                <p class="dom-empty" hidden>Фразы закончились</p>
                <table class="phrase-table">
                    <tr>
                        <th>латинский язык</th>
                        <th>русский язык</th>
                    </tr>
                </table>
            </div>
        </div>
    </section>
</main>

<div data-include="footer"></div>

<script src="js/layout.js"></script>
<script src="js/dom.js"></script>
</body>
</html>
