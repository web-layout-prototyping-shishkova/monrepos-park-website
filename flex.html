<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flexbox — Парк Монрепо</title>
    <meta name="description" content="Задание Flexbox, вариант 4: мальчик и кирпич.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/flex.css">
</head>
<body>

<div data-include="header"></div>

<main>
    <section class="page-title">
        <div class="container">
            <h1>Flexbox</h1>
            <p>Вариант 4. Наведение и нажатие меняют картинку и слова.</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="content">
                <button class="flexbox" type="button">
                    <img class="flexbox__boy flexbox__boy--stand" src="images/flex/boy1.png" alt="Мальчик">
                    <p class="flexbox__text flexbox__text--guess">Это мяч? ...</p>
                    <img class="flexbox__boy flexbox__boy--think" src="images/flex/boy2.png" alt="">
                    <img class="flexbox__brick" src="images/flex/boy7.png" alt="Кирпич">
                    <img class="flexbox__boy flexbox__boy--fall" src="images/flex/boy3.png" alt="">
                    <p class="flexbox__text flexbox__text--brick">Это кирпич ...</p>
                </button>
            </div>
        </div>
    </section>
</main>

<div data-include="footer"></div>

<script src="js/layout.js"></script>
<script src="js/flex.js"></script>
</body>
</html>
