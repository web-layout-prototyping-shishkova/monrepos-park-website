<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Рисунок — Парк Монрепо</title>
    <meta name="description" content="Рисунок гитары средствами CSS, вариант 5.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pic.css">
</head>
<body>

<div data-include="header"></div>

<main>
    <section class="page-title">
        <div class="container">
            <h1>Рисунок</h1>
            <p>Вариант 5 — гитара, 200×200.</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="content">
                <div class="pic" role="img" aria-label="Гитара">
                    <div class="guitar">
                        <div class="guitar__neck"></div>
                        <div class="guitar__head"></div>
                        <div class="guitar__body"></div>
                        <div class="guitar__hole"></div>
                        <div class="guitar__bridge"></div>
                        <div class="guitar__strings"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<div data-include="footer"></div>

<script src="js/layout.js"></script>
</body>
</html>
